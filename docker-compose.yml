services:
  postgres:
    image: postgres:17

    container_name: nest-postgres

    restart: always

    environment:
      POSTGRES_USER: shakib
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nest_prisma_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  nest-api:
    build: .
    container_name: nest-api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_modules:/app/node_modules

    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
  app_modules:
  